aid: horizon-quantum-computing
name: Horizon Quantum Computing
description: >-
  Horizon Quantum Computing is a Singapore-based quantum software company founded in 2018 by
  Dr. Joe Fitzsimons. It builds software infrastructure for quantum applications, centered on
  Triple Alpha, an integrated development environment that lets developers write hardware-agnostic
  quantum programs at multiple levels of abstraction and deploy them to quantum processors. Triple
  Alpha's final workflow step packages a program and deploys it as an API so developers can invoke
  quantum backends from Python scripts, web pages, and other technologies. Horizon operates its own
  quantum computing testbed at its Singapore headquarters and supports a range of external quantum
  processors, aiming to bridge the gap between today's quantum hardware and real-world applications.
  The company does not currently publish a public developer API, OpenAPI specification, or client
  SDK; API-based program deployment is offered to early-access users of the Triple Alpha platform.
